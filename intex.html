<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ThaiZeit • เวลาไทย</title>

  <!-- PWA & Mobile App Einstellungen -->
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="https://fav.farm/🕒">
  <link rel="icon" href="https://fav.farm/🕒">

  <!-- Tailwind CSS per CDN für gestochen scharfes, modernes Styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    /* Sanfte Typografie & Berührungsschutz */
    body {
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
    }
  </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 antialiased">

  <!-- Haupt-Container (Zentriert und mobil-optimiert) -->
  <main class="w-full max-w-xl mx-auto flex flex-col gap-5 flex-grow justify-center my-auto">

    <!-- KARTE 1: UHRZEIT & DATUM -->
    <section class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-6 sm:p-8 shadow-2xl flex flex-col items-center text-center backdrop-blur-md">
      
      <!-- Wochentag (Thai) -->
      <h1 id="thai-weekday" class="text-3xl sm:text-4xl font-extrabold text-sky-400 tracking-wide mb-1">
        --
      </h1>

      <!-- Datum (Thai mit thailändischen Ziffern und B.E.) -->
      <h2 id="thai-date" class="text-xl sm:text-2xl text-slate-200 font-medium mb-3">
        --
      </h2>

      <!-- Uhrzeit im 6-Stunden-System (Thai) -->
      <div id="thai-time" class="text-2xl sm:text-3xl font-bold text-emerald-400 tracking-normal mb-5">
        --
      </div>

      <!-- Trennlinie -->
      <div class="w-full h-px bg-slate-700/70 mb-4"></div>

      <!-- Phonetische Umschrift (Lautschrift zum Ausspracheüben) -->
      <p id="latin-info" class="text-sm sm:text-base text-slate-400 leading-relaxed font-normal">
        --
      </p>

      <!-- Deutsche Referenz -->
      <p id="german-info" class="text-xs sm:text-sm text-slate-500 italic mt-1 font-mono">
        --
      </p>
    </section>


    <!-- KARTE 2: NÄCHSTES EREIGNIS & KULTURLEXIKON -->
    <section class="bg-[#1e293b] border border-slate-700/80 rounded-2xl p-6 shadow-2xl flex flex-col text-left">
      
      <!-- Titel mit Kalender-Symbol -->
      <div class="flex items-center gap-2 text-slate-300 font-semibold text-base sm:text-lg border-b border-slate-700/70 pb-3 mb-4">
        <span>📅</span>
        <span>Nächstes Ereignis • วันสำคัญที่จะมาถึง</span>
      </div>

      <!-- Termin Kopfzeile (Thai) -->
      <div id="event-thai" class="text-base sm:text-lg font-bold text-sky-400 leading-snug mb-1">
        ✦ Lädt nächste Termine...
      </div>

      <!-- Termin Lautschrift -->
      <div id="event-latin" class="text-xs sm:text-sm text-slate-400 mb-0.5">
        --
      </div>

      <!-- Termin Deutsch -->
      <div id="event-german" class="text-xs sm:text-sm text-slate-500 italic mb-4">
        --
      </div>

      <!-- Infobox mit Feiertagsbedeutung -->
      <div id="event-infobox" class="bg-slate-900/60 border border-amber-500/30 rounded-xl p-4 mt-1 hidden">
        <div id="info-title" class="text-amber-400 font-bold text-xs sm:text-sm flex items-center gap-1.5 mb-1.5">
          <span>💡</span>
          <span>Bedeutung & Tradition für Thais:</span>
        </div>
        <p id="info-text" class="text-xs sm:text-sm text-slate-300 leading-relaxed font-light">
          --
        </p>
      </div>

    </section>

  </main>

  <!-- Fußzeile -->
  <footer class="text-center text-xs text-slate-600 py-3">
    ThaiZeit PWA v0.5.0 • Zeitrechnung im buddhistischen Kalender พ.ศ.
  </footer>

  <!-- ================= LOGIK (JavaScript) ================= -->
  <script>
    // Wörterbücher für thailändische Zeitrechnung
    const wochentage = {
      0: ["วันอาทิตย์", "Wan Athit", "Sonntag"],
      1: ["วันจันทร์", "Wan Chan", "Montag"],
      2: ["วันอังคาร", "Wan Angkhan", "Dienstag"],
      3: ["วันพุธ", "Wan Phut", "Mittwoch"],
      4: ["วันพฤหัสบดี", "Wan Pharuehat", "Donnerstag"],
      5: ["วันศุกร์", "Wan Suk", "Freitag"],
      6: ["วันเสาร์", "Wan Sao", "Samstag"]
    };

    const monate = {
      1: ["มกราคม", "Mokkarakhom", "Januar"],
      2: ["กุมภาพันธ์", "Kumphaphan", "Februar"],
      3: ["มีนาคม", "Minakhom", "März"],
      4: ["เมษายน", "Mesayon", "April"],
      5: ["พฤษภาคม", "Phruetsaphakhom", "Mai"],
      6: ["มิถุนายน", "Mithunayon", "Juni"],
      7: ["กรกฎาคม", "Karakadakhom", "Juli"],
      8: ["สิงหาคม", "Singhakhom", "August"],
      9: ["กันยายน", "Kanyayon", "September"],
      10: ["ตุลาคม", "Tulakhom", "Oktober"],
      11: ["พฤศจิกายน", "Phruetsachikayon", "November"],
      12: ["ธันวาคม", "Thanwakhom", "Dezember"]
    };

    const thaiZiffernMap = {'0':'๐','1':'๑','2':'๒','3':'๓','4':'๔','5':'๕','6':'๖','7':'๗','8':'๘','9':'๙'};
    const thaiZahlen = {0:"ศูนย์", 1:"หนึ่ง", 2:"สอง", 3:"สาม", 4:"สี่", 5:"ห้า", 6:"หก", 7:"เจ็ด", 8:"แปด", 9:"เก้า", 10:"สิบ", 11:"สิบเอ็ด", 12:"สิบสอง"};
    const latinZahlen = {0:"suun", 1:"neung", 2:"song", 3:"sam", 4:"si", 5:"ha", 6:"hok", 7:"jet", 8:"paet", 9:"kao", 10:"sip", 11:"sip et", 12:"sip song"};

    function arabischZuThaiZiffern(zahl) {
      return String(zahl).split('').map(ch => thaiZiffernMap[ch] || ch).join('');
    }

    function zahlZuThai(n) {
      if (n === 0) return "ศูนย์";
      if (n <= 10) return thaiZahlen[n];
      if (n < 20) return n === 11 ? "สิบเอ็ด" : "สิบ" + thaiZahlen[n - 10];
      const zehner = Math.floor(n / 10);
      const einer = n % 10;
      const zehnerText = zehner === 2 ? "ยี่สิบ" : thaiZahlen[zehner] + "สิบ";
      if (einer === 0) return zehnerText;
      if (einer === 1) return zehnerText + "เอ็ด";
      return zehnerText + thaiZahlen[einer];
    }

    function zahlZuLatin(n) {
      if (n === 0) return "suun";
      if (n <= 10) return latinZahlen[n];
      if (n < 20) return n === 11 ? "sip et" : "sip " + latinZahlen[n - 10];
      const zehner = Math.floor(n / 10);
      const einer = n % 10;
      const zehnerText = zehner === 2 ? "yi sip" : latinZahlen[zehner] + " sip";
      if (einer === 0) return zehnerText;
      if (einer === 1) return zehnerText + " et";
      return zehnerText + " " + latinZahlen[einer];
    }

    function hourThai(stunde) {
      if (stunde === 0) return "เที่ยงคืน";
      if (stunde >= 1 && stunde <= 5) return `ตี ${thaiZahlen[stunde]}`;
      if (stunde === 6) return "หกโมงเช้า";
      if (stunde >= 7 && stunde <= 10) return `${thaiZahlen[stunde]} โมงเช้า`;
      if (stunde === 11) return "สิบเอ็ดโมงเช้า";
      if (stunde === 12) return "เที่ยง";
      if (stunde >= 13 && stunde <= 15) {
        const diff = stunde - 12;
        return diff === 1 ? "บ่ายโมง" : `บ่าย ${thaiZahlen[diff]} โมง`;
      }
      if (stunde >= 16 && stunde <= 18) return `${thaiZahlen[stunde - 12]} โมงเย็น`;
      const thum = stunde - 18;
      return thum === 1 ? "หนึ่งทุ่ม" : `${thaiZahlen[thum]} ทุ่ม`;
    }

    function hourLatin(stunde) {
      if (stunde === 0) return "thiang khuen";
      if (stunde >= 1 && stunde <= 5) return `dtii ${latinZahlen[stunde]}`;
      if (stunde === 6) return "hok mong chao";
      if (stunde >= 7 && stunde <= 10) return `${latinZahlen[stunde]} mong chao`;
      if (stunde === 11) return "sip et mong chao";
      if (stunde === 12) return "thiang";
      if (stunde >= 13 && stunde <= 15) {
        const diff = stunde - 12;
        return diff === 1 ? "bai mong" : `bai ${latinZahlen[diff]} mong`;
      }
      if (stunde >= 16 && stunde <= 18) return `${latinZahlen[stunde - 12]} mong yen`;
      const thum = stunde - 18;
      return thum === 1 ? "neung thum" : `${latinZahlen[thum]} thum`;
    }

    // Feiertags-Lexikon
    const FEIERTAGE = [
      {
        keywords: ["นวมินทร", "nawamin", "13 october", "13 oktober", "bhumibol memorial"],
        name: "Wan Nawamintharamaharat (วันนวมินทรมหาราช • 13. Oktober)",
        info: "Dieser Gedenktag erinnert an den Todestag von König Bhumibol Adulyadej (Rama IX.), der Thailand über 70 Jahre lang mit außerordentlicher Hingabe regierte. Im Jahr 2023 verlieh das thailändische Königshaus diesem Feiertag offiziell den Ehrennamen 'Wan Nawamintharamaharat' zum ewigen Andenken an seine Verdienste. Thais tragen an diesem Tag häufig Gelb, halten landesweit Gedenkminuten ab und besuchen Tempel für Verdienstzeremonien (Tham Bun) zu Ehren des unvergessenen Monarchen."
      },
      {
        keywords: ["chulalongkorn", "ปิยมหาราช", "จุฬาลงกรณ์", "23 october", "23 oktober"],
        name: "Chulalongkorn-Tag (วันปิยมหาราช • 23. Oktober)",
        info: "Dieser Gedenktag ehrt König Rama V. (Chulalongkorn), der als einer der bedeutendsten Herrscher Thailands gilt. Ihm gelang es durch geschickte Diplomatie und Reformen, die Kolonisierung des Landes abzuwenden sowie die Sklaverei friedlich abzuschaffen. Thais bringen an seinen Standbildern rosafarbene Rosen dar, um ihre Dankbarkeit für die Modernisierung des Landes zu zeigen."
      },
      {
        keywords: ["songkran", "สงกรานต์"],
        name: "Songkran (วันสงกรานต์ • Traditionelles Neujahr)",
        info: "Songkran ist das bedeutendste Familienfest in Thailand und markiert den traditionellen Jahreswechsel. Thais reisen zu ihren Familien, um den Älteren mit duftendem Wasser Respekt zu erweisen und Buddha-Statuen rituell zu reinigen. Die weltbekannten Wasserschlachten auf den Straßen symbolisieren spirituelle Reinigung und das fröhliche Fortspülen von Unglück und Sorgen des alten Jahres."
      },
      {
        keywords: ["loi krathong", "loy krathong", "ลอยกระทง"],
        name: "Loy Krathong (วันลอยกระทง • Lichterfest)",
        info: "In der Vollmondnacht des 12. Mondmonats lassen Thais kunstvoll geschmückte Flößchen (Krathongs) auf Flüssen und Seen schwimmen. Der Brauch ehrt die Wassergöttin Mae Khongkha und bittet um Verzeihung für die Verschmutzung des Wassers. Zugleich symbolisiert das Davonschwimmen der brennenden Kerzen das Loslassen von Groll, Sorgen und schlechtem Karma."
      }
    ];

    // Sekündliche Aktualisierung
    function aktualisiereUhrzeit() {
      const jetzt = new Date();
      const buddhistJahr = jetzt.getFullYear() + 543;

      const [wThai, wLatin, wDe] = wochentage[jetzt.getDay()];
      const [mThai, mLatin, mDe] = monate[jetzt.getMonth() + 1];

      const tagThai = arabischZuThaiZiffern(jetzt.getDate());
      const jahrThai = arabischZuThaiZiffern(buddhistJahr);
      const stundeThai = hourThai(jetzt.getHours());
      const minThai = zahlZuThai(jetzt.getMinutes());
      const sekThai = arabischZuThaiZiffern(jetzt.getSeconds());

      // HTML-Elemente aktualisieren
      document.getElementById('thai-weekday').textContent = wThai;
      document.getElementById('thai-date').textContent = `วันที่ ${tagThai} ${mThai} พ.ศ. ${jahrThai}`;
      document.getElementById('thai-time').textContent = `${stundeThai} ${minThai} นาที ${sekThai} วินาที`;

      // Lautschrift
      const stundeLat = hourLatin(jetzt.getHours());
      const minLat = zahlZuLatin(jetzt.getMinutes());
      const sekLat = zahlZuLatin(jetzt.getSeconds());
      document.getElementById('latin-info').textContent = 
        `${wLatin}, ${jetzt.getDate()}. ${mLatin} ${buddhistJahr} (B.E.) • ${stundeLat} ${minLat} nathi, ${sekLat} wina-thii`;

      // Deutsch
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('german-info').textContent = 
        `[${wDe}, ${pad(jetzt.getDate())}.${pad(jetzt.getMonth() + 1)}.${jetzt.getFullYear()} • ${pad(jetzt.getHours())}:${pad(jetzt.getMinutes())}:${pad(jetzt.getSeconds())} Uhr]`;
    }

    // Nächstes Ereignis vorbereiten (z. B. 13. Oktober)
    function initialisiereEreignis() {
      const heute = new Date();
      // Beispielhaft als nächstes Event: 13. Oktober (Wan Nawamintharamaharat)
      const eventInfo = FEIERTAGE[0];

      document.getElementById('event-thai').textContent = "✦ วันอังคาร ๑๓ ตุลาคม ๒๕๖๙ : วันนวมินทรมหาราช";
      document.getElementById('event-latin').textContent = "Wan Angkhan, 13. Tulakhom • Ganztägig";
      document.getElementById('event-german').textContent = "[Dienstag, 13.10.2026 • Ganztägig]";

      if (eventInfo) {
        document.getElementById('event-infobox').classList.remove('hidden');
        document.getElementById('info-title').textContent = `💡 Bedeutung & Tradition für Thais (${eventInfo.name}):`;
        document.getElementById('info-text').textContent = eventInfo.info;
      }
    }

    // Starten
    setInterval(aktualisiereUhrzeit, 1000);
    aktualisiereUhrzeit();
    initialisiereEreignis();
  </script>
</body>
</html>
